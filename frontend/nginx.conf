server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Compression for the text assets (script.js is ~90 KB). text/event-stream is deliberately not listed: the chat stream
  # must not be buffered or compressed.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # The retro UI uses inline styles/handlers, hence 'unsafe-inline'. Tighten when the UI is ported to modules.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_http_version 1.1;
    proxy_set_header Connection "";                  # HTTP/1.1 upstream: do not forward "close"
    proxy_buffering off;                             # required for SSE streaming
    proxy_cache off;
    proxy_read_timeout 120s;                         # longer than the app's own run limits (AGENT_TIMEOUT_S / LLM_TIMEOUT_S)
    client_max_body_size 64k;                        # a question plus six history turns fits comfortably
    limit_req zone=api burst=10 nodelay;
    limit_req_status 429;                            # default would be 503, which looks like an outage
  }

  # MCP (Model Context Protocol) endpoint for external clients: stateless JSON over POST, read-only tools.
  location = /mcp {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;                      # the backend allow-lists Host (DNS-rebinding protection)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
    limit_req zone=api burst=10 nodelay;
    limit_req_status 429;
  }

  # The pixel font never changes: cache it hard. (`expires` is used instead of add_header on purpose: any add_header in a
  # location silently drops the security headers inherited from the server block.)
  location /fonts/ { expires 30d; try_files $uri =404; }

  location / { try_files $uri $uri/ =404; }
}
