server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # The retro UI uses inline styles/handlers, hence 'unsafe-inline'. Tighten when the UI is ported to modules.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.allorigins.win; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_http_version 1.1;
    proxy_buffering off;                             # required for SSE streaming
    proxy_read_timeout 60s;
    client_max_body_size 16k;
    limit_req zone=api burst=10 nodelay;
    limit_req_status 429;                            # default would be 503, which looks like an outage
  }

  location / { try_files $uri $uri/ =404; }
}
