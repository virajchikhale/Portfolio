name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4            # local embedding model (~90 MB), so CI does not re-download it
        with:
          path: backend/models
          key: fastembed-${{ hashFiles('backend/app/config.py') }}
      - run: ruff check .
      - run: python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/all-MiniLM-L6-v2', cache_dir='models')"
      - run: pytest -q
        env:
          RUN_LOCAL_EMBEDDING_TESTS: "1"   # real-model semantic + retrieval-quality gate
          EMBEDDING_CACHE_DIR: models
      - run: pip-audit -r requirements.txt   # known-vulnerable dependency check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2    # fails the build if an API key is committed
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
