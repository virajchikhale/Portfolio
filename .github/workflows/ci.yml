name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No paths: filters on purpose. A required check that is skipped never reports,
# and that would block merging forever.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit==2.10.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6   # local embedding model (~90 MB), so CI does not re-download it
        with:
          path: backend/models
          key: fastembed-${{ hashFiles('backend/app/config.py') }}
      - run: ruff check .
      - run: python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/all-MiniLM-L6-v2', cache_dir='models')"
      - run: pytest -q
        env:
          RUN_LOCAL_EMBEDDING_TESTS: "1"   # real-model semantic + retrieval-quality gate
          EMBEDDING_CACHE_DIR: models
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/test
      - name: Answer-quality evaluation (deterministic layer, both modes)
        run: python scripts/eval_answers.py
        env:
          EMBEDDING_CACHE_DIR: models
      # Starlette is held below 0.47 by FastAPI 0.115 (see requirements.txt). These advisories
      # are fixed only in Starlette >= 0.47 / 1.x, which needs a FastAPI upgrade. Remove the
      # --ignore-vuln flags when that upgrade lands.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-1941 --ignore-vuln PYSEC-2026-1942 --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-2281 --ignore-vuln PYSEC-2026-248 --ignore-vuln PYSEC-2026-249

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: backend/models
          key: fastembed-${{ hashFiles('backend/app/config.py') }}
      - run: python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/all-MiniLM-L6-v2', cache_dir='backend/models')"
      - name: Browser checks (headless Firefox, real backend)
        run: e2e/run.sh
        env:
          EMBEDDING_CACHE_DIR: ${{ github.workspace }}/backend/models
          HF_HUB_OFFLINE: "1"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose config -q
      - run: docker build -t ci-backend ./backend
      - run: docker build -t ci-frontend ./frontend

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ubuntu-latest ships Node (>= 20, the package's engines floor), so no setup-node action is needed.
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Offline tests (fake LLM, stubbed embeddings, red-team + retrieval eval sets)
        run: npm test
      - name: Dependency audit (runtime deps only)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The single check to require in branch protection. Job renames above never break it.
  ci-gate:
    if: always()
    needs: [backend, typescript, e2e, docker, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
